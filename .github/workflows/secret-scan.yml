name: 🔒 Secret Scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 🕵️ Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not just the latest commit -- a secret committed
          # once and later "removed" is still in history and still a leak.
          fetch-depth: 0

      # Installed directly from gitleaks' own GitHub releases rather than a
      # third-party wrapping Action, matching the convention used by
      # shellcheck.yml -- and it sidesteps gitleaks-action's org licensing
      # requirement entirely, since the CLI itself is plain MIT-licensed.
      - name: 📥 Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o /tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks_${GITLEAKS_VERSION}_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && sha256sum --ignore-missing -c gitleaks_${GITLEAKS_VERSION}_checksums.txt)
          sudo tar --extract --gzip --file /tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz \
            --directory /usr/local/bin gitleaks
          gitleaks version

      - name: 🕵️ Scan full history for secrets
        run: gitleaks git --redact --verbose .
