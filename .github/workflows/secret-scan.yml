name: 🔒 Secret Scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 🕵️ Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history, not just the latest commit -- a secret committed
          # once and later "removed" is still in history and still a leak.
          fetch-depth: 0

      # Installed directly from gitleaks' own GitHub releases rather than a
      # third-party wrapping Action, matching the convention used by
      # shellcheck.yml -- and it sidesteps gitleaks-action's org licensing
      # requirement entirely, since the CLI itself is plain MIT-licensed.
      - name: 📥 Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          sudo tar --extract --gzip --file /tmp/gitleaks.tar.gz \
            --directory /usr/local/bin gitleaks
          gitleaks version

      - name: 🕵️ Scan full history for secrets
        run: gitleaks git --redact --verbose .
