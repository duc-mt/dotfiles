name: 🐍 Python Codestyle

on:
  workflow_call:
    inputs:
      path:
        description: "Path to lint with flake8"
        required: false
        type: string
        default: "."
      python-version:
        description: "Python version to run flake8 under"
        required: false
        type: string
        default: "3.14"
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Run py-codestyle check
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version || '3.14' }}

      - name: 📥 Install Checking Modules
        run: |
          pip install --upgrade pep8-naming flake8 \
            flake8-broken-line flake8-bugbear flake8-multiline-containers \
            flake8-tidy-imports flake8-pytest-style flake8-variables-names \
            flake8-comprehensions

      - name: ✔️ Run Codestyle
        env:
          LINT_PATH: ${{ inputs.path || '.' }}
        run: flake8 "${LINT_PATH}"
