name: 📥 Sync submodules

on:
  workflow_call:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: sync-submodules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: ⤵️ Sync Submodules
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: ⬇️ Pull Submodules Recursively
        shell: bash
        run: |
          git submodule update --init --recursive --remote

      - name: ⬆️ Push Changes (if any)
        shell: bash
        run: |
          git config user.name "Duc Mai"
          git config user.email "ducmai.network@gmail.com"
          git commit -am "chore: sync submodules" || true
          git push origin master
